<!DOCTYPE html
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 8%,#263b70 0%,transparent 58%),linear-gradient(180deg,#080d25,#17264b,#080d25);color:#fff;font-family:Arial,sans-serif;text-align:center}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;color:#fff;text-shadow:0 0 12px #fff,0 0 24px #a9c9ff;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
.container{position:relative;z-index:1;width:100%;max-width:700px;margin:auto;padding:24px 16px 45px}
.top{margin:12px 0 25px;color:#ffe4f3;font-size:18px;line-height:2}
.decor{font-size:32px;margin:24px 0;animation:beat 1.6s infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.card{padding:24px 16px;margin:22px auto;border:2px solid #ffb8e6;border-radius:32px;background:#ffffff0d;box-shadow:0 0 22px #ff8ad8,inset 0 0 20px #ffffff08}
.photo{width:220px;height:260px;max-width:80%;margin:0 auto 20px;padding:5px;border:3px solid #ffb9e8;border-radius:46% 46% 44% 44%;box-shadow:0 0 25px #ff82d4;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 55%;border-radius:44% 44% 42% 42%;display:block}
h1{font-size:clamp(25px,6vw,38px);color:#ffc4e8;text-shadow:0 0 15px #ff71c8;line-height:1.5}
h2{color:#ffd1ec;line-height:1.8}
.message{font-size:17px;line-height:2.1;white-space:pre-line;color:#fff0f8;margin:22px 0}
.flowers{font-size:34px;margin:22px 0}
button{border:0;border-radius:28px;padding:13px 22px;margin:8px 4px;background:linear-gradient(90deg,#ff82ce,#ffc4e7);color:#401333;font-size:16px;font-weight:bold;box-shadow:0 0 15px #ff8bd9;cursor:pointer}
.music{margin:25px auto;padding:20px 12px;border:1px solid #e7a9df;border-radius:25px;background:#ffffff0d}
#player{width:100%;max-width:360px;height:200px;margin-top:12px;border:0;border-radius:12px}
footer{margin-top:32px;color:#ffd2ec;line-height:2}
.small{font-size:14px;color:#e7d9f5}
</style>
</head>
